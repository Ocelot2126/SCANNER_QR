<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #2c3e50;
      font-size: 3.2em;
      margin-bottom: 30px;
    }
    .link-list {
      list-style: none;
      padding: 0;
    }
    .link-list li {
      margin: 10px 0;
    }
    .link-list a {
      text-decoration: none;
      color: #1e90ff;
      font-size: 2.2em;
      transition: color 0.3s;
    }
    .link-list a:hover {
      color: #0a66c2;
    }
  </style>
</head>
<body>
  <h1>Wikipedia Links</h1>
  <ul class="link-list">
    <li><a href="https://en.wikipedia.org/wiki/Vermont" target="_blank">Vermont (VT)</a></li>
    <li><a href="https://en.wikipedia.org/wiki/New_Hampshire" target="_blank">New Hampshire (NH)</a></li>
    <li><a href="https://en.wikipedia.org/wiki/Rhode_Island" target="_blank">Rhode Island (RI)</a></li>
    <li><a href="https://en.wikipedia.org/wiki/Massachusetts" target="_blank">Massachusetts (MA)</a></li>
    <li><a href="https://en.wikipedia.org/wiki/Connecticut" target="_blank">Connecticut (CT)</a></li>
  </ul>
</body>
</html>
