<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector QR Interactivos</title>
  <!-- Librería para escanear QR desde el navegador -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; margin: 0; background: #f4f4f9; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
    #media-container { margin-top: 20px; display: none; }
    #player-wrapper { width: 100%; max-width: 500px; margin: 0 auto; }
    iframe, audio { width: 100%; max-width: 400px; border-radius: 8px; }
    .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; margin: 10px 5px; }
    .btn-fs { background: #28a745; }
  </style>
</head>
<body>

  <h2>Escáner de Historia</h2>
  <div id="reader"></div>

  <div id="media-container">
    <h3 id="media-title"></h3>
    <div id="player-wrapper"></div>
    <div id="controls">
      <button id="fullscreen-btn" class="btn btn-fs" style="display:none;" onclick="pantallaCompleta()">Pantalla Completa</button>
      <button class="btn" onclick="reiniciarEscaner()">Escanear otro QR</button>
    </div>
  </div>

  <script>
    const mapaContenido = {
      "https://es.wikipedia.org/wiki/Historia_de_Texas": {
        tipo: "youtube",
        id: "dQw4w9WgXcQ",
        titulo: "Historia de Texas"
      },
      "https://en.wikipedia.org/wiki/California": {
        tipo: "youtube",
        id: "iNni60n2qIE",
        titulo: "California"
      },
      "https://en.wikipedia.org/wiki/California/": {
        tipo: "youtube",
        id: "iNni60n2qIE",
        titulo: "California"
      },
      "https://es.wikipedia.org/wiki/Historia_de_California": {
        tipo: "audio",
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        titulo: "Audio: Historia de California"
      }
    };

    let html5QrcodeScanner;
    let ytPlayer;

    function alDetectarQR(qrCodeMessage) {
      html5QrcodeScanner.clear();
      document.getElementById('reader').style.display = 'none';

      const urlLimpia = qrCodeMessage.trim();
      const datos = mapaContenido[urlLimpia];

      const container = document.getElementById('media-container');
      const title = document.getElementById('media-title');
      const wrapper = document.getElementById('player-wrapper');
      const fsBtn = document.getElementById('fullscreen-btn');

      container.style.display = 'block';

      if (datos) {
        title.innerText = datos.titulo;
        
        if (datos.tipo === "youtube") {
          wrapper.innerHTML = `<div id="yt-player"></div>`;
          fsBtn.style.display = 'inline-block';
          
          ytPlayer = new YT.Player('yt-player', {
            height: '250',
            width: '100%',
            videoId: datos.id,
            playerVars: {
              'autoplay': 1,
              'playsinline': 1
            }
          });
        } else if (datos.tipo === "audio") {
          fsBtn.style.display = 'none';
          wrapper.innerHTML = `<audio controls autoplay src="${datos.url}"></audio>`;
        }
      } else {
        fsBtn.style.display = 'none';
        title.innerText = "Contenido no registrado";
        wrapper.innerHTML = `<p>El QR leído (${urlLimpia}) no está configurado en la base de datos.</p>`;
      }
    }

    function pantallaCompleta() {
      const iframe = document.querySelector('#player-wrapper iframe');
      if (iframe) {
        if (iframe.requestFullscreen) {
          iframe.requestFullscreen();
        } else if (iframe.webkitRequestFullscreen) { /* Safari */
          iframe.webkitRequestFullscreen();
        } else if (iframe.msRequestFullscreen) {
          iframe.msRequestFullscreen();
        }
      }
    }

    function iniciarEscaner() {
      document.getElementById('reader').style.display = 'block';
      document.getElementById('media-container').style.display = 'none';
      document.getElementById('player-wrapper').innerHTML = '';

      const config = {
        fps: 15,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          let minEdgePercentage = 0.80;
          let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
          return {
            width: Math.floor(minEdgeSize * minEdgePercentage),
            height: Math.floor(minEdgeSize * minEdgePercentage)
          };
        },
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        },
        videoConstraints: {
          facingMode: "environment",
          width: { min: 640, ideal: 1280, max: 1920 },
          height: { min: 480, ideal: 720, max: 1080 },
          focusMode: "continuous"
        }
      };

      html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false);
      html5QrcodeScanner.render(alDetectarQR);
    }

    function reiniciarEscaner() {
      iniciarEscaner();
    }

    window.onload = iniciarEscaner;
  </script>
</body>
</html>
